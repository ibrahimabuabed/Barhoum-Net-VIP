<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إنشاء حساب - Barhoum Net</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap'); body { font-family: 'Cairo', sans-serif; background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; color: #fff;} .card { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #334155;} .logo { font-size: 32px; font-weight: 900; color: #10b981; margin-bottom: 20px;} .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #334155; } .tab { flex: 1; padding: 15px; font-weight: bold; color: #94a3b8; text-decoration: none; transition: 0.3s; } .tab.active { color: #10b981; border-bottom: 3px solid #10b981; } input { width: 100%; box-sizing: border-box; padding: 16px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: white; font-family: 'Cairo'; font-size:16px;} input:focus{ outline:none; border-color:#10b981;} .hint { font-size: 12px; color: #94a3b8; text-align: right; margin-bottom: 15px;} .btn { width: 100%; padding: 16px; background: #10b981; color: white; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 18px; font-family:'Cairo'; transition:0.3s;} .btn:hover { background: #059669;} .error { color: #fca5a5; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; border:1px solid rgba(239,68,68,0.3); text-align:right;}</style></head><body><div class="card"><div class="logo">Barhoum Net</div><div class="tabs"><a href="{{ url_for('login') }}" class="tab">تسجيل الدخول</a><a href="{{ url_for('register') }}" class="tab active">إنشاء حساب جديد</a></div><p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">انضم للشبكة الأقوى بخطوة واحدة!</p>{% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}<form method="POST"><input type="text" name="phone" placeholder="📱 رقم الجوال" value="{{ phone_val or '' }}" required><div class="hint">مثال: 0591234567 (10 أرقام فقط)</div><input type="password" name="password" placeholder="🔒 اختر كلمة مرور قوية" required style="margin-bottom:25px;"><button type="submit" class="btn">تأكيد وإنشاء الحساب</button></form></div></body></html>
